name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  # Resolve o aviso de Node 20 nas anotações
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Apply Android native setup
        run: node scripts/setup-android.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      # PASSO CRÍTICO: Sobrescreve o arquivo com a correção do try-with-resources
      - name: Inject Correct Java Code
        run: |
          cat <<EOF > android/app/src/main/java/com/brittizin/lyrabreakcoreos/LyraMediaScannerPlugin.java
          package com.brittizin.lyrabreakcoreos;
          import android.Manifest;
          import android.content.ContentResolver;
          import android.content.ContentUris;
          import android.database.Cursor;
          import android.media.MediaMetadataRetriever;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import androidx.annotation.NonNull;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.PermissionState;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          @CapacitorPlugin(
              name = "LyraMediaScanner",
              permissions = {
                  @Permission(
                      alias = "audio",
                      strings = {
                          Manifest.permission.READ_MEDIA_AUDIO,
                          Manifest.permission.READ_EXTERNAL_STORAGE
                      }
                  )
              }
          )
          public class LyraMediaScannerPlugin extends Plugin {
              @PluginMethod
              public void syncDeviceLibrary(PluginCall call) {
                  if (getPermissionState("audio") != PermissionState.GRANTED) {
                      requestPermissionForAlias("audio", call, "permissionCallback");
                      return;
                  }
                  runScan(call);
              }

              @PluginMethod
              public void getPermissionStatus(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put("granted", getPermissionState("audio") == PermissionState.GRANTED);
                  call.resolve(result);
              }

              @PermissionCallback
              private void permissionCallback(PluginCall call) {
                  if (getPermissionState("audio") != PermissionState.GRANTED) {
                      call.reject("Permissão de áudio negada.");
                      return;
                  }
                  runScan(call);
              }

              private void runScan(PluginCall call) {
                  try {
                      JSArray songs = new JSArray();
                      Set<String> syncedIds = new HashSet<>();
                      File audioDir = new File(getContext().getFilesDir(), "device-library/audio");
                      File coverDir = new File(getContext().getFilesDir(), "device-library/covers");
                      if (!audioDir.exists()) audioDir.mkdirs();
                      if (!coverDir.exists()) coverDir.mkdirs();

                      Uri collection = Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q
                          ? MediaStore.Audio.Media.getContentUri(MediaStore.VOLUME_EXTERNAL)
                          : MediaStore.Audio.Media.EXTERNAL_CONTENT_URI;

                      String[] projection = new String[] {
                          MediaStore.Audio.Media._ID,
                          MediaStore.Audio.Media.TITLE,
                          MediaStore.Audio.Media.ARTIST,
                          MediaStore.Audio.Media.ALBUM,
                          MediaStore.Audio.Media.DISPLAY_NAME,
                          MediaStore.Audio.Media.MIME_TYPE,
                          MediaStore.Audio.Media.SIZE,
                          MediaStore.Audio.Media.DURATION,
                          MediaStore.Audio.Media.DATE_MODIFIED,
                          MediaStore.Audio.Media.IS_MUSIC
                      };

                      String selection = "(" + MediaStore.Audio.Media.MIME_TYPE + "=? OR " + MediaStore.Audio.Media.DISPLAY_NAME + " LIKE ?) AND " + MediaStore.Audio.Media.IS_MUSIC + "!=0";
                      String[] selectionArgs = new String[] { "audio/mpeg", "%.mp3" };
                      String sortOrder = MediaStore.Audio.Media.DATE_MODIFIED + " DESC";

                      ContentResolver resolver = getContext().getContentResolver();
                      try (Cursor cursor = resolver.query(collection, projection, selection, selectionArgs, sortOrder)) {
                          if (cursor == null) {
                              call.reject("Não foi possível ler os MP3s.");
                              return;
                          }
                          int idIndex = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media._ID);
                          int titleIndex = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.TITLE);
                          int nameIndex = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DISPLAY_NAME);
                          int modifiedIndex = cursor.getColumnIndexOrThrow(MediaStore.Audio.Media.DATE_MODIFIED);

                          while (cursor.moveToNext()) {
                              long mediaStoreId = cursor.getLong(idIndex);
                              long modifiedSeconds = cursor.getLong(modifiedIndex);
                              Uri contentUri = ContentUris.withAppendedId(collection, mediaStoreId);
                              File audioFile = new File(audioDir, "device-" + mediaStoreId + "-" + modifiedSeconds + ".mp3");

                              if (!audioFile.exists()) copyUriToFile(resolver, contentUri, audioFile);
                              
                              JSObject item = new JSObject();
                              item.put("id", (int)-mediaStoreId);
                              item.put("title", cursor.getString(titleIndex));
                              item.put("filePath", audioFile.getAbsolutePath());
                              songs.put(item);
                          }
                      }
                      JSObject result = new JSObject();
                      result.put("songs", songs);
                      call.resolve(result);
                  } catch (Exception error) {
                      call.reject("Erro no scan", error);
                  }
              }

              private void copyUriToFile(ContentResolver resolver, Uri sourceUri, File targetFile) throws IOException {
                  try (InputStream input = resolver.openInputStream(sourceUri); FileOutputStream output = new FileOutputStream(targetFile)) {
                      byte[] buffer = new byte[8192];
                      int read;
                      while ((read = input.read(buffer)) != -1) output.write(buffer, 0, read);
                  }
              }

              private byte[] readEmbeddedArt(Uri uri) {
                  try (MediaMetadataRetriever retriever = new MediaMetadataRetriever()) {
                      retriever.setDataSource(getContext(), uri);
                      return retriever.getEmbeddedPicture();
                  } catch (Exception ignored) {
                      return null;
                  }
              }

              private String safeText(String v, String f) { return (v == null || v.isEmpty()) ? f : v; }
              private String fileNameWithoutExt(String v) { return v.substring(0, v.lastIndexOf('.')); }
              private String extensionFromDisplayName(String n) { return ".mp3"; }
              private String imageExtensionFromBytes(@NonNull byte[] b) { return ".jpg"; }
          }
          EOF

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyra-breakcore-os-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
